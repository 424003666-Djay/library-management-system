<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Book - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Library Management System</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">
    <h1 class="mb-4">Issue / Borrow Book</h1>

    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Pumili ng Libro</label>
            <select name="book" class="form-select" required>
                <option value="">-- Pumili ng Libro --</option>
                {% for book in books %}
                    <option value="{{ book.id }}">{{ book.title }} (Available: {{ book.quantity }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Pumili ng Borrower</label>
            <select name="borrower" class="form-select" required>
                <option value="">-- Pumili ng Borrower --</option>
                {% for borrower in borrowers %}
                    <option value="{{ borrower.id }}">{{ borrower.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Issue Book</button>
        <a href="/borrowing-records/" class="btn btn-secondary">Cancel</a>
    </form>
</div>

</body>
</html>
