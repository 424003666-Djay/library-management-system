
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Library Management System</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Library Dashboard</h1>
    <p>Welcome to your Library Management System!</p>

    <div class="row g-4 mt-2">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Total Books</h5>
                    <h2>{{ total_books }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Total Borrowers</h5>
                    <h2>{{ total_borrowers }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Borrowing Records</h5>
                    <h2>{{ total_borrowing_records }}</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        
<div class="mt-4 d-flex flex-wrap gap-2">
    <a href="/books/" class="btn btn-primary">View Books</a>
    <a href="/borrowers/" class="btn btn-success">View Borrowers</a>
    <a href="/borrowing-records/" class="btn btn-info">View Borrowing Records</a>
    <a href="/admin/" class="btn btn-dark">Manage Library (Admin)</a>
</div>

    </div>
</div>

</body>
</html>
